[project]
name = "expense-tracker"
version = "0.1.0"
description = "Import yearly Google Sheets expenses into SQLite and explore them in a local dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "gspread>=6.0,<7",
    "xlrd>=2.0,<3",
]

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["expense_tracker"]

[tool.setuptools.package-data]
expense_tracker = ["templates/*.html"]
