[project]
# "expense-tracker" is taken on PyPI; the command is still `expense-tracker`
name = "sheets-expense-tracker"
dynamic = ["version"]
description = "Import yearly Google Sheets expenses and bank statements into SQLite and explore them in a local dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "karanrn" }]
keywords = ["expenses", "budget", "personal-finance", "google-sheets", "sqlite", "dashboard", "bank-statements"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "openpyxl>=3.1,<4",
    "gspread>=6.0,<7",
    "xlrd>=2.0,<3",
]

[project.urls]
Repository = "https://github.com/karanrn/expense-tracker"
Issues = "https://github.com/karanrn/expense-tracker/issues"
Changelog = "https://github.com/karanrn/expense-tracker/blob/main/CHANGELOG.md"

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["expense_tracker"]

[tool.setuptools.dynamic]
version = { attr = "expense_tracker.__version__" }

[tool.setuptools.package-data]
expense_tracker = ["templates/*.html", "templates/*.js", "templates/*.xlsx", "config.example.toml"]
