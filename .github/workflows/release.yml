# Publish to PyPI when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0).
# One-time setup: on pypi.org, add a "trusted publisher" for project sheets-expense-tracker with
# this repository, workflow release.yml and environment pypi; then create the "pypi"
# environment under the repository's Settings > Environments.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import expense_tracker; print(expense_tracker.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: python -m pip install -r requirements.txt build
      - run: python -m unittest discover -s tests -t .
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: no API token stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
